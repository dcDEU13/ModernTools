# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# TODO: Change the workflow name to something more specific
name: Python application

# This defines the triggers for the workflow
# i.e. when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# This defines the permissions for the workflow
permissions:
  contents: read

jobs:
  build:

    # This defines the type of machine to run the job on
    runs-on: ubuntu-latest

    steps:

    # This step copies your repository code to the runner
    - uses: actions/checkout@v7

    # This step sets up Python on the runner
    # TODO: Change the Python version to 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    
    # TODO: Install uv on the runner
    - name: Installing uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        
    - name: Install dependencies
      run: uv sync

    - name: Test with pytest
      run: uv run python -m pytest

    - name: Lint with ruff
      run: uvx ruff check 

    - name: Check formatting with Ruff
      run: uv run ruff format .

    - name: Type check with mypy
      run: uvx ty check 

